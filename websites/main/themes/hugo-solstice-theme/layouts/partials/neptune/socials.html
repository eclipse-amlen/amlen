<ul class="social-media-list">
  {{ range $.Site.Params.socials }}
    <li>
      <a href="{{ .url }}" aria-label="{{ .name }}">
        <span class="fa-stack">
          <i class="fa-solid fa-circle fa-stack-2x" aria-hidden="true"></i>
          <i class="{{ .icon }} fa-stack-1x fa-inverse" aria-hidden="true"></i>
        </span>
      </a>
    </li>
  {{ end }}
</ul>
